AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Infrastructure for Cloud Image Processing System - Member 3'

Resources:
  # 1. S3 Bucket A: Chứa ảnh gốc
  SourceImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-source-images-${AWS::AccountId}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: ['PUT', 'POST', 'GET']
            AllowedOrigins: ['*']
            MaxAge: 3000

  # 2. S3 Bucket B: Chứa ảnh đã xử lý
  ProcessedImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-processed-images-${AWS::AccountId}'

  # 3. DynamoDB Table: Lưu trữ Metadata của ảnh
  ImageMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ImageMetadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ImageId
          AttributeType: S
      KeySchema:
        - AttributeName: ImageId
          KeyType: HASH
